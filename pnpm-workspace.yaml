pmOnFail: ignore

minimumReleaseAgeExclude:
  - '@next/*'
  - next

allowBuilds:
  esbuild: false

# Versiones corregidas de dependencias internas de Next.js (avisos de seguridad de pnpm audit).
overrides:
  browserslist: ^4.28.7
  nanoid@3: ^3.3.18
  source-map-js: ^1.2.2
  baseline-browser-mapping: ^2.11.0
